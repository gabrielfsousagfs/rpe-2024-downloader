name: Baixar RPE 2024 Completo

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Python package (matching container)
        run: pip install playwright==1.58.0

      - name: Run download script
        run: python download.py

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: RPE_2024_ZIPs
          path: pdfs_rpe_2024/*.zip